<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Employee Form</title>
</head>

<body>

<h1 th:text="${title}">Add Employee</h1>

<form th:action="@{/employees}" th:object="${employee}" method="post">

    <input type="hidden" th:field="*{id}">

    <label>Name:</label>
    <input type="text" th:field="*{name}" required>
    <br><br>

    <label>Email:</label>
    <input type="email" th:field="*{email}" required>
    <br><br>

    <label>Department:</label>
    <input type="text" th:field="*{department}" required>
    <br><br>

    <label>Salary:</label>
    <input type="number" step="0.01" th:field="*{salary}" required>
    <br><br>

    <button type="submit">Save Employee</button>

</form>

<br>

<a th:href="@{/employees}">Back to Employee List</a>

</body>

</html>
